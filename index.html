<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心測旅程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #ffffffbd;
      --text: #000000;
      --muted: #000000;
      --accent: #000000;
      --border: #B8BDC324;
      --shadow: rgba(42, 48, 68, 0.14);
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px 14px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -6%;
      z-index: 0;
      background: url("img/結果圖/銀河漫遊線.png") center / cover no-repeat;
      filter: blur(30px);
      opacity: 0.38;
      transform: scale(1.12);
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1920px, 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 22px 50px var(--shadow);
      padding: clamp(18px, 3vw, 32px);
      background: var(--surface);
      backdrop-filter: blur(12px);
      animation: rise 580ms ease both;
    }

    .brand {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.02em;
      color: var(--accent);
      line-height: 1;
    }

    .lead {
      margin: 8px 0 16px;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .meter {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #B8BDC3;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter>i {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 320ms ease;
    }

    .step {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .stage {
      margin-top: 16px;
      min-height: 290px;
      animation: fadeIn 280ms ease;
    }

    .stage.transition-exit-left {
      animation: pageExitLeft 500ms ease both;
    }

    .stage.transition-exit-up {
      animation: pageExitUp 500ms ease both;
    }

    .stage.transition-enter-right {
      animation: pageEnterRight 500ms ease both;
    }

    .stage.transition-enter-bottom {
      animation: pageEnterBottom 500ms ease both;
    }

    .q {
      font-size: clamp(1.1rem, 2.8vw, 1.48rem);
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.45;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: #ffffffe6;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      text-align: left;
      font-size: 0.98rem;
      color: var(--text);
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .option.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--shadow);
      background: #8b8b8b;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ghost {
      background: var(--surface);
      color: var(--text);
    }

    .ghost:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main {
      background: var(--accent);
      color: var(--white);
    }

    .main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-title {
      margin: 4px 0 8px;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      color: var(--accent);
    }

    .result-desc {
      margin: 0;
      line-height: 1.7;
      color: var(--text);
    }

    .result-visual {
      position: relative;
      width: min(860px, 100%);
      margin: 4px auto 14px;
    }

    .result-page-image {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      animation: resultImageFadeIn 700ms ease both;
    }

    .ticket-gate {
      display: grid;
      justify-items: center;
      gap: 14px;
      margin: 18px auto;
    }

    .ticket-card {
      position: relative;
      width: 1040px;
      max-width: 100%;
      height: auto;
      cursor: pointer;
      transition: transform 220ms ease;
    }

    .ticket-card:hover {
      transform: scale(1.04);
    }

    .ticket-card.ticket-exit {
      animation: ticketExitToCorner 500ms ease forwards;
      pointer-events: none;
    }

    .ticket-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .ticket-date {
      position: absolute;
      left: 6.9%;
      bottom: 7%;
      color: #12305a;
      font-size: clamp(13px, 1.45vw, 18px);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
    }

    .ticket-hint {
      margin: 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: clamp(1.9rem, 1.4vw, 2.12rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.42), 0 2px 8px rgba(0, 0, 0, 0.42);
      animation: ticketHintPulse 3.2s ease-in-out infinite;
    }

    .adventure-button {
      position: absolute;
      left: 40.5%;
      bottom: 12.5%;
      z-index: 2;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.28));
      transform: translateX(-50%);
      transition: transform 180ms ease, filter 180ms ease;
    }

    .adventure-button:hover {
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.32));
      transform: translateX(-50%) scale(1.03);
    }

    .adventure-button:active {
      transform: translateX(-50%) scale(0.98);
    }

    .adventure-button-image {
      display: block;
      width: min(520px, 33vw);
      height: auto;
    }

    .result-download-button {
      display: block;
      margin: 16px auto 0;
      padding: 12px 28px;
      border: 2px solid #12305a;
      border-radius: 999px;
      background: #ffd86b;
      color: #12305a;
      font-size: clamp(0.95rem, 1.4vw, 1.12rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      box-shadow: 0 6px 0 rgba(18, 48, 90, 0.26), 0 12px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .result-download-button:hover {
      transform: scale(1.03);
    }

    .result-download-button:active {
      transform: scale(0.98);
      box-shadow: 0 3px 0 rgba(18, 48, 90, 0.26), 0 8px 14px rgba(0, 0, 0, 0.18);
    }

    .adventure-visual {
      position: relative;
      width: min(860px, 100%);
      margin: 4px auto 14px;
    }

    .adventure-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      animation: resultImageFadeIn 700ms ease both;
    }

    .adventure-exit-button {
      position: absolute;
      right: 6%;
      bottom: 4%;
      z-index: 2;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.28));
      transition: transform 180ms ease, filter 180ms ease;
    }

    .adventure-exit-button:hover {
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.32));
      transform: scale(1.03);
    }

    .adventure-exit-button:active {
      transform: scale(0.98);
    }

    .adventure-exit-image {
      display: block;
      width: min(180px, 28vw);
      height: auto;
    }

    .cover-mode,
    .result-image-mode {
      width: min(1080px, calc(100vw - 28px));
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      background: transparent;
      backdrop-filter: none;
    }

    .cover-mode .brand,
    .cover-mode .lead,
    .cover-mode .meter,
    .cover-mode .step,
    .cover-mode .actions {
      display: none;
    }

    .cover-mode .stage {
      margin-top: 0;
    }

    .cover-scene {
      position: relative;
      display: grid;
      place-items: center;
    }

    .cover-image {
      width: min(1280px, 100%);
      height: auto;
      display: block;
      cursor: pointer;
      animation: coverFloat 4s ease-in-out infinite;
    }

    .cover-start-btn {
      position: absolute;
      left: 50%;
      bottom: clamp(32px, 7%, 84px);
      transform: translateX(-50%);
      z-index: 2;
      padding: clamp(10px, 1.3vw, 15px) clamp(28px, 4vw, 48px);
      border: 2px solid #12305a;
      border-radius: 999px;
      background: #ffd86b;
      color: #12305a;
      font-size: clamp(1rem, 1.7vw, 1.28rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      box-shadow: 0 8px 0 rgba(18, 48, 90, 0.26), 0 14px 24px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .cover-start-btn:hover {
      transform: translateX(-50%) scale(1.03);
    }

    .cover-start-btn:active {
      transform: translateX(-50%) scale(0.98);
      box-shadow: 0 4px 0 rgba(18, 48, 90, 0.26), 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    .result-image-mode .actions {
      display: none;
    }

    .result-image-mode .ticket-image {
      max-width: 100%;
    }

    .result-image-mode .result-page-image {
      max-width: 100%;
      height: auto;
    }

    .result-image-mode .brand,
    .result-image-mode .lead,
    .result-image-mode .meter,
    .result-image-mode .step {
      display: none;
    }

    .result-image-mode .stage {
      margin-top: 0;
    }

    .result-meta {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      color: var(--text);
      line-height: 1.7;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--accent);
      color: var(--white);
      margin-bottom: 10px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .quiz-mode {
      width: min(1280px, calc(100vw - 28px));
      aspect-ratio: 3 / 2;
      position: relative;
      overflow: hidden;
      padding: 0;
      background: url("img/UI/內頁/第 站.png") center / cover no-repeat;
      background-size: contain;
      border: none;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .quiz-mode .brand,
    .quiz-mode .lead,
    .quiz-mode .meter,
    .quiz-mode .step {
      display: none;
    }

    .quiz-mode .stage {
      position: absolute;
      inset: 0;
      margin: 0;
      min-height: 0;
    }

    .quiz-layout {
      width: 100%;
      height: 100%;
      position: relative;
      padding: clamp(46px, 5.8vw, 78px) clamp(42px, 6.4vw, 86px);
    }

    .question-panel {
      width: min(68%, 820px);
      color: var(--text);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      row-gap: 14px;
      align-content: start;
    }

    .question-number {
      margin: 0;
      font-size: clamp(2.4rem, 4.5vw, 4.4rem);
      font-weight: 900;
      line-height: 1;
    }

    .question-title {
      margin: 0;
      font-size: clamp(1.3rem, 2.25vw, 2rem);
      font-weight: 900;
      line-height: 1.45;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .quiz-mode .options {
      width: min(62%, 760px);
      position: absolute;
      left: clamp(42px, 6.4vw, 86px);
      top: clamp(300px, 38vh, 500px);
      display: grid;
      gap: clamp(10px, 1.15vh, 14px);
    }

    .quiz-mode .option {
      width: 100%;
      min-height: clamp(10px, 7.8vh, 30px);
      display: grid;
      grid-template-columns: clamp(66px, 6vw, 88px) 1fr clamp(46px, 4vw, 62px);
      align-items: stretch;
      padding: 0;
      overflow: hidden;
      border: 3px solid var(--text);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 6px 6px 0 var(--text);
      color: var(--text);
      font-weight: 700;
    }

    .quiz-mode .option-letter {
      display: grid;
      place-items: center;
      background: #F6A623;
      color: var(--text);
      font-size: clamp(1.35rem, 2vw, 1.7rem);
      font-weight: 900;
      border-right: 3px solid var(--text);
    }

    .quiz-mode .option-text {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      line-height: 1.45;
      text-align: left;
      font-size: clamp(0.98rem, 1.28vw, 1.18rem);
    }

    .quiz-mode .option-arrow {
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }

    .quiz-mode .option:hover,
    .quiz-mode .option.active {
      transform: translateX(4px);
      border-color: var(--text);
      background: #fff7dd;
    }

    .station-progress {
      position: absolute;
      left: clamp(250px, 6.4vw, 300px);
      bottom: clamp(22px, 2.8vw, 38px);
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--text);
      font-weight: 800;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid var(--text);
      border-radius: 999px;
      padding: 10px 18px;
    }

    .station-dots {
      display: flex;
      gap: 8px;
    }

    .station-dot {
      width: 12px;
      height: 12px;
      border: 2px solid var(--text);
      border-radius: 999px;
      background: var(--white);
    }

    .station-dot.active {
      background: #F6A623;
    }

    .station-count {
      min-width: 78px;
      font-size: clamp(0.92rem, 1.1vw, 1.05rem);
    }

    .station-name {
      color: var(--text);
      font-size: clamp(0.92rem, 1.1vw, 1.05rem);
    }

    .quiz-mode .actions {
      position: absolute;
      right: clamp(30px, 4.2vw, 58px);
      bottom: clamp(26px, 3vw, 42px);
      margin: 0;
      z-index: 3;
    }

    .quiz-mode .ghost {
      width: clamp(86px, 8vw, 200px);
      aspect-ratio: 2.7 / 1;
      padding: 0 10px;
      border-radius: 0;
      background-color: transparent;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      color: var(--white);
      font-size: clamp(0.72rem, 0.9vw, 0.9rem);
      line-height: 1;
      text-shadow: 0 1px 3px var(--text);
      filter: drop-shadow(0 7px 9px rgba(0, 0, 0, 0.28));
    }

    .quiz-mode #prevBtn {
      background-image: url("img/UI/上下一步/上一站.png");
    }

    .quiz-mode #nextBtn {
      background-image: url("img/UI/上下一步/下一站.png");
    }

    .quiz-mode #nextBtn.result-next {
      background-image: url("img/UI/上下一步/看結果.png");
    }

    @media (max-width: 640px) {
      body {
        align-items: start;
        overflow-y: auto;
      }

      .shell {
        border-radius: 18px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .quiz-mode {
        width: min(100%, 520px);
        min-height: auto;
        aspect-ratio: auto;
        background-size: 100% 100%;
        overflow: visible;
      }

      .quiz-mode .stage {
        position: relative;
        inset: auto;
        min-height: 0;
      }

      .quiz-layout {
        min-height: 760px;
        padding: 28px 18px;
      }

      .question-panel,
      .quiz-mode .options {
        width: 100%;
        position: static;
      }

      .quiz-mode .options {
        margin-top: 24px;
      }

      .station-progress,
      .quiz-mode .actions {
        position: static;
        margin-top: 24px;
      }

      .station-progress {
        flex-wrap: wrap;
      }

      .quiz-mode .actions {
        flex-direction: row;
        justify-content: center;
        gap: 16px;
      }

      .quiz-mode .ghost {
        width: clamp(132px, 38vw, 172px);
        min-width: 132px;
        min-height: 54px;
        padding: 0;
      }

      .ticket-card {
        width: min(100%, calc(100vw - 28px));
        max-width: 100%;
      }

      .ticket-image {
        width: 100%;
        max-width: 100%;
        height: auto;
      }

      .ticket-hint {
        font-size: clamp(1rem, 4.2vw, 1.2rem);
        line-height: 1.5;
        padding: 0 12px;
      }

      .result-visual,
      .adventure-visual {
        width: 100%;
        margin: 0 auto 14px;
      }

      .result-image-mode {
        width: min(100%, calc(100vw - 28px));
      }

      .adventure-button {
        left: 60%;
        bottom: 12.5%;
      }

      .adventure-button-image {
        width: min(340px, 58vw);
      }

      .adventure-exit-button {
        width: auto;
        right: 5%;
        bottom: 3%;
      }

      .adventure-exit-image {
        width: min(118px, 22vw);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes coverFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes resultImageFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes ticketHintPulse {
      0%,
      100% {
        opacity: 0.72;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes pageExitLeft {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-110%);
      }
    }

    @keyframes pageExitUp {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-110%);
      }
    }

    @keyframes pageEnterRight {
      from {
        opacity: 0;
        transform: translateX(110%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pageEnterBottom {
      from {
        opacity: 0;
        transform: translateY(110%);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ticketExitToCorner {
      from {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      to {
        opacity: 0;
        transform: translate(42vw, -36vh) scale(0.62);
      }
    }
  </style>
</head>

<body>
  <main class="shell" role="application" aria-label="心理測驗">
    <h1 class="brand">焦通工具</h1>
    <p class="lead">你一早醒來發現已經十點半了，要遲到了。6 題情境測驗，依顏色分佈判定你的心理型態。</p>

    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
    <div class="step" id="step">第 1 / 6 題</div>

    <section class="stage" id="stage"></section>

    <div class="actions" id="actions">
      <button class="ghost" id="prevBtn" type="button"></button>
      <button class="ghost" id="nextBtn" type="button" disabled></button>
    </div>
  </main>

  <script>
    const lines = ["成癮線", "比較線", "外貌線", "社交線", "飛天熱狗線"];
    const colorNames = ["藍色", "洋紅", "綠色", "橘色", "紅色"];
    const lineToColor = {
      "成癮線": "藍色",
      "比較線": "洋紅",
      "外貌線": "綠色",
      "社交線": "橘色",
      "飛天熱狗線": "紅色"
    };
    const rules = {
      extremeAtLeast: 5,
      mixedPatterns: [
        [2, 1, 1, 1, 1],
        [2, 2, 2, 0, 0],
        [2, 2, 1, 1, 0]
      ],
      tiePattern: [3, 3, 0, 0, 0],
      dominantPatterns: [
        [4, 2, 0, 0, 0],
        [4, 1, 1, 0, 0],
        [3, 2, 1, 0, 0],
        [3, 1, 1, 1, 0]
      ],
      labels: {
        extreme: "第一類：極端型",

          { label: "方便補妝和自拍的計程車，搭什麼都不重要，重要的是你今天必須好看", line: "外貌線" },
          { label: "自己開車，或許聚會結束後還能載朋友們回家", line: "社交線" },
          { label: "騎飛天熱狗去", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第三題：突然有幾隻小動物闖了進來，你覺得是什麼動物？",
        options: [
          { label: "不停往嘴巴塞松果的松鼠，不知道什麼時能吃完", line: "成癮線" },
          { label: "幾隻狼闖了進來，彼此互相觀察、好像在比較誰更強", line: "比較線" },
          { label: "一隻時尚的變色龍，看起來最近流行紅色", line: "外貌線" },
          { label: "可愛的小狗在猛搖尾巴，想吸引你的注意", line: "社交線" },
          { label: "一根飛天熱狗，身上沾滿番茄醬", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第四題：一直有件令你煩心的事，你覺得是什麼？",
        options: [
          { label: "經過一塊訊號不好的區域，你覺得很煩，頁面不停刷新卻沒辦法顯示內容", line: "成癮線" },
          { label: "你的朋友不斷和你提及他假期去了多少國家玩", line: "比較線" },
          { label: "下了一場大雨，你抱怨這毀了你的妝和服裝", line: "外貌線" },
          { label: "朋友還沒回你的訊息，你懷疑是不是說錯話了", line: "社交線" },
          { label: "飛天熱狗比你想像中的還難吃（被碰瓷）", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第五題：終於到達目的地了，你發現時間還很充裕，這時候你會選擇做什麼來打發時間？",
        options: [
          { label: "你不自覺打開手機 app 又關掉，不斷重複", line: "成癮線" },
          { label: "吃著剛剛點的雞塊，但你很介意為什麼這份比較小", line: "比較線" },
          { label: "你一直撥弄劉海和檢查妝容，絕對不能出差錯", line: "外貌線" },
          { label: "一次次刷新通知欄，想著新發的照片有沒有人點讚", line: "社交線" },
          { label: "追著飛天熱狗跑", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第六題：活動結束後，你在回家的路上遇見了某人，你認為他是？",
        options: [
          { label: "一個逃出鐘錶店的小偷", line: "成癮線" },
          { label: "學校裡受歡迎的人生勝利組", line: "比較線" },
          { label: "正在幫路人街頭攝影的攝影師", line: "外貌線" },
          { label: "一群聊八卦的同學", line: "社交線" },
          { label: "一個穿著飛天熱狗服裝的猛漢", line: "飛天熱狗線" }
        ]
      }
    ];

    const stage = document.getElementById("stage");
    const shell = document.querySelector(".shell");
    const step = document.getElementById("step");
    const bar = document.getElementById("bar");
    const actions = document.getElementById("actions");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let current = 0;
    const answers = Array(questions.length).fill(null);
    const transitionMs = 500;
    let isTransitioning = false;

    function updateMeter() {
      const pct = (Math.min(current + 1, questions.length) / questions.length) * 100;
      bar.style.width = `${pct}%`;
      step.textContent = `第 ${Math.min(current + 1, questions.length)} / ${questions.length} 題`;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function formatTicketDate(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}.${month}.${day}`;
    }

    function clearTransitionClasses() {
      stage.classList.remove(
        "transition-exit-left",
        "transition-exit-up",
        "transition-enter-right",
        "transition-enter-bottom"
      );
    }

    async function transitionStage(renderNext, exitClass, enterClass) {
      if (isTransitioning) return;
      isTransitioning = true;
      try {
        clearTransitionClasses();
        stage.classList.add(exitClass);
        await wait(transitionMs);
        renderNext();
        clearTransitionClasses();
        void stage.offsetWidth;
        stage.classList.add(enterClass);
        await wait(transitionMs);
        clearTransitionClasses();
      } finally {
        isTransitioning = false;
      }
    }

    function restartQuiz() {
      current = 0;
      for (let i = 0; i < answers.length; i++) answers[i] = null;
      renderQuestion();
    }

    function restartToCover() {
      current = 0;
      for (let i = 0; i < answers.length; i++) answers[i] = null;
      bar.style.width = "0%";
      renderCover();
    }

    function renderCover() {
      shell.classList.add("cover-mode");
      shell.classList.remove("quiz-mode", "result-image-mode");
      actions.style.display = "none";
      stage.innerHTML = `
        <div class="cover-scene">
          <img class="cover-image" id="coverImage" src="${coverImagePath}" alt="焦通工具封面" onerror="this.hidden=true">
          <button class="cover-start-btn" id="coverStartBtn" type="button">進入車站</button>
        </div>
      `;

      const startQuizFromCover = () => {
        transitionStage(() => renderQuestion(), "transition-exit-left", "transition-enter-right");
      };
      stage.querySelector("#coverImage").addEventListener("click", startQuizFromCover);
      stage.querySelector("#coverStartBtn").addEventListener("click", startQuizFromCover);
    }

    function renderQuestion() {
      shell.classList.add("quiz-mode");
      shell.classList.remove("cover-mode", "result-image-mode");
      actions.style.display = "";
      prevBtn.style.display = "inline-block";
      nextBtn.onclick = null;
      updateMeter();
      const q = questions[current];
      const letters = ["A", "B", "C", "D", "E"];
      const dots = questions.map((_, idx) => `
        <i class="station-dot ${idx === current ? "active" : ""}" aria-hidden="true"></i>
      `).join("");
      stage.innerHTML = `
        <div class="quiz-layout">
          <section class="question-panel">
            <p class="question-number">Q${current + 1}.</p>
            <h2 class="q question-title">${q.text}</h2>
          </section>
          <div class="options">
            ${q.options.map((opt, idx) => `
              <button class="option ${answers[current] === idx ? "active" : ""}" type="button" data-idx="${idx}">
                <span class="option-letter">${letters[idx]}</span>
                <span class="option-text">${opt.label}</span>
                <span class="option-arrow" aria-hidden="true">›</span>
              </button>
            `).join("")}
          </div>
          <div class="station-progress" aria-label="目前站數進度">
            <span class="station-dots">${dots}</span>
            <span class="station-count">${current + 1} / ${questions.length} 站</span>
            <span class="station-name">目前第 ${current + 1} 站</span>
          </div>
        </div>
      `;

      prevBtn.disabled = current === 0;
      nextBtn.textContent = "";
      nextBtn.setAttribute("aria-label", current === questions.length - 1 ? "看結果" : "下一站");
      nextBtn.classList.toggle("result-next", current === questions.length - 1);
      nextBtn.disabled = answers[current] === null;

      stage.querySelectorAll(".option").forEach((el) => {
        el.addEventListener("click", () => {
          answers[current] = Number(el.dataset.idx);
          renderQuestion();
        });
      });
    }

    function buildLineCount() {
      const count = Object.fromEntries(lines.map((line) => [line, 0]));
      answers.forEach((pick, i) => {
        const line = questions[i].options[pick].line;
        count[line] += 1;
      });
      return count;
    }

    function toColorCount(lineCount) {
      return colorNames.map((color) => {
        const line = Object.keys(lineToColor).find((key) => lineToColor[key] === color);
        return lineCount[line];
      });
    }

    function isPattern(values, pattern) {
      const sorted = values.slice().sort((a, b) => b - a);
      return sorted.every((v, i) => v === pattern[i]);
    }

    function classifyResult(lineCount) {
      const colorCount = toColorCount(lineCount);
      const maxCount = Math.max(...colorCount);

      if (maxCount >= rules.extremeAtLeast) {
        const idx = colorCount.indexOf(maxCount);
        return {
          category: rules.labels.extreme,
          title: `${colorNames[idx]}極端`,
          endingLine: `${colorNames[idx]}極端`
        };
      }

      if (rules.mixedPatterns.some((pattern) => isPattern(colorCount, pattern))) {
        return {
          category: rules.labels.mixed,
          title: "均勻混合型",
          endingLine: "銀河漫遊線"
        };
      }

      if (isPattern(colorCount, rules.tiePattern)) {
        const tied = colorNames.filter((name, i) => colorCount[i] === 3);
        const tieKey = tied.slice().sort((a, b) => colorNames.indexOf(a) - colorNames.indexOf(b)).join("+");
        return {
          category: rules.labels.tie,
          title: `${tied[0]}＋${tied[1]}`,
          endingLine: rules.tieEndings[tieKey] || "未命名結局線"
        };
      }

      const maxHits = colorCount.filter((n) => n === maxCount).length;
      const isDominantPattern = rules.dominantPatterns.some((pattern) => isPattern(colorCount, pattern));
      if (maxHits === 1 && isDominantPattern) {
        const idx = colorCount.indexOf(maxCount);
        const dominantColor = colorNames[idx];
        return {
          category: rules.labels.dominant,
          title: `${dominantColor}主導`,
          endingLine: rules.dominantEndings[dominantColor] || "未命名結局線"
        };
      }

      return {
        category: rules.labels.unknown,
        title: "規則外分佈",
        endingLine: "未命名結局線"
      };
    }

    function getResultPageImagePath(endingLineTitle, content) {
      return resultPageImageMap[endingLineTitle] || content.image || "";
    }

    function getAdventureImagePath(endingLineTitle) {
      return adventureImageMap[endingLineTitle] || "";
    }

    function getMainLineForEnding(endingLineTitle) {
      return endingMainLineMap[endingLineTitle] || "";
    }

    function getAdventureButtonImagePath(endingLineTitle) {
      const mainLine = getMainLineForEnding(endingLineTitle);
      return adventureButtonImageMap[mainLine] || "";
    }

    function getAdventureExitImagePath(endingLineTitle) {
      const mainLine = getMainLineForEnding(endingLineTitle);
      return mainLine === "飛天熱狗線"
        ? "img/結果頁面/按鈕/飛天熱狗線退出鍵.png"
        : "img/結果頁面/按鈕/一般退出鍵.png";
    }

    function getResultDownloadName(endingLineTitle) {
      return `焦通工具-${endingLineTitle || "測驗結果"}.png`;
    }

    function downloadResultImage(imagePath, fileName) {
      const link = document.createElement("a");
      link.href = imagePath;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function getImageErrorHandler(primaryImage, fallbackImage) {
      if (fallbackImage && fallbackImage !== primaryImage) {
        return `this.onerror=null;this.src='${fallbackImage}'`;
      }
      return "this.hidden=true";
    }

    function getEndingContent(endingLineTitle) {
      return endingContent[endingLineTitle] || defaultEndingContent;
    }

    function renderAdventurePage(resultData) {
      const {
        endingLine,
        adventureImage
      } = resultData;
      const exitImage = getAdventureExitImagePath(endingLine.title);

      stage.innerHTML = `
        <div class="adventure-visual">
          <img class="adventure-image" src="${adventureImage}" alt="${endingLine.title} 大冒險" onerror="this.hidden=true">
          <button class="adventure-exit-button" id="adventureExitButton" type="button" aria-label="重新開始">
            <img class="adventure-exit-image" src="${exitImage}" alt="重新開始" onerror="this.closest('button').hidden=true">
          </button>
        </div>
      `;

      const exitButton = stage.querySelector("#adventureExitButton");
      if (exitButton) {
        exitButton.addEventListener("click", restartToCover);
      }
    }

    function renderResultPage(resultData) {
      const {
        endingLine,
        resultPageImage,
        imageErrorHandler,
        adventureImage,
        adventureButtonImage
      } = resultData;
      const adventureButton = adventureImage && adventureButtonImage
        ? `
          <button class="adventure-button" id="adventureButton" type="button" aria-label="大冒險">
            <img class="adventure-button-image" src="${adventureButtonImage}" alt="大冒險" onerror="this.closest('button').hidden=true">
          </button>
        `
        : "";
      const downloadButton = resultPageImage
        ? `<button class="result-download-button" id="downloadResultBtn" type="button">下載結果頁</button>`
        : "";

      stage.innerHTML = `
        <div class="result-visual">
          ${resultPageImage ? `<img class="result-page-image" src="${resultPageImage}" alt="${endingLine.title} 完整結果頁" onerror="${imageErrorHandler}">` : ""}
          ${adventureButton}
        </div>
        ${downloadButton}
      `;

      const adventureButtonEl = stage.querySelector("#adventureButton");
      if (adventureButtonEl) {
        adventureButtonEl.addEventListener("click", (event) => {
          event.stopPropagation();
          renderAdventurePage(resultData);
        });
      }

      const downloadButtonEl = stage.querySelector("#downloadResultBtn");
      if (downloadButtonEl) {
        downloadButtonEl.addEventListener("click", (event) => {
          event.stopPropagation();
          downloadResultImage(resultPageImage, getResultDownloadName(endingLine.title));
        });
      }
    }

    function renderResult() {
      shell.classList.remove("quiz-mode");
      shell.classList.add("result-image-mode");
      const lineCount = buildLineCount();
      const result = classifyResult(lineCount);
      const endingLine = {
        title: result.endingLine || "未命名結局線"
      };
      const content = getEndingContent(endingLine.title);
      const resultPageImage = getResultPageImagePath(endingLine.title, content);
      const imageErrorHandler = getImageErrorHandler(resultPageImage, content.image);
      const adventureImage = getAdventureImagePath(endingLine.title);
      const mainLine = getMainLineForEnding(endingLine.title);
      const adventureButtonImage = getAdventureButtonImagePath(endingLine.title);
      console.log("[result debug]", {
        endingLine: endingLine.title,
        mainLine,
        adventureImage,
        adventureButtonImage
      });
      const resultData = {
        endingLine,
        resultPageImage,
        imageErrorHandler,
        adventureImage,
        adventureButtonImage
      };

      bar.style.width = "100%";
      actions.style.display = "none";
      const ticketDate = formatTicketDate();

      stage.innerHTML = `
        <div class="ticket-gate">
          <div class="ticket-card" id="ticketBtn" aria-label="查看結果">
            <img class="ticket-image" src="${ticketImagePath}" alt="查看結果車票" onerror="this.hidden=true">
            <span class="ticket-date">${ticketDate}</span>
          </div>
          <p class="ticket-hint">這是專屬於你的車票，點擊它前往下一站吧</p>
        </div>
      `;

      const ticket = stage.querySelector("#ticketBtn");
      const showResultPage = async () => {
        if (isTransitioning) return;
        isTransitioning = true;
        ticket.classList.add("ticket-exit");
        await wait(transitionMs);
        renderResultPage(resultData);
        clearTransitionClasses();
        void stage.offsetWidth;
        stage.classList.add("transition-enter-right");
        await wait(transitionMs);
        clearTransitionClasses();
        isTransitioning = false;
      };
      ticket.addEventListener("click", showResultPage);
    }

    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (answers[current] === null) return;
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        transitionStage(() => renderResult(), "transition-exit-up", "transition-enter-bottom");
      }
    });

    renderCover();
  </script>
</body>

</html>
