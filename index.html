<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心測旅程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #ffffffbd;
      --text: #000000;
      --muted: #000000;
      --accent: #000000;
      --border: #B8BDC324;
      --shadow: rgba(42, 48, 68, 0.14);
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px 14px;
    }

    .shell {
      width: min(1080px, 100%);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 22px 50px var(--shadow);
      padding: clamp(18px, 3vw, 32px);
      background: var(--surface);
      backdrop-filter: blur(12px);
      animation: rise 580ms ease both;
    }

    .brand {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.02em;
      color: var(--accent);
      line-height: 1;
    }

    .lead {
      margin: 8px 0 16px;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .meter {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: #B8BDC3;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter>i {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 320ms ease;
    }

    .step {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .stage {
      margin-top: 16px;
      min-height: 290px;
      animation: fadeIn 280ms ease;
    }

    .q {
      font-size: clamp(1.1rem, 2.8vw, 1.48rem);
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.45;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: #ffffffe6;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      text-align: left;
      font-size: 0.98rem;
      color: var(--text);
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .option.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--shadow);
      background: #8b8b8b;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ghost {
      background: var(--surface);
      color: var(--text);
    }

    .ghost:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main {
      background: var(--accent);
      color: var(--white);
    }

    .main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-title {
      margin: 4px 0 8px;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      color: var(--accent);
    }

    .result-desc {
      margin: 0;
      line-height: 1.7;
      color: var(--text);
    }

    .result-visual {
      width: min(540px, 100%);
      position: relative;
      display: grid;
      place-items: center;
      margin: 4px auto 14px;
    }

    .result-template {
      width: 100%;
      display: block;
    }

    .result-mascot {
      width: 46%;
      max-height: 62%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      display: block;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .result-meta {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      color: var(--text);
      line-height: 1.7;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--accent);
      color: var(--white);
      margin-bottom: 10px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .shell {
        border-radius: 18px;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

          { label: "幾隻狼闖了進來，彼此互相觀察、好像在比較誰更強", line: "比較線" },
          { label: "一隻時尚的變色龍，看起來最近流行紅色", line: "外貌線" },
          { label: "可愛的小狗在猛搖尾巴，想吸引你的注意", line: "社交線" },
          { label: "一根飛天熱狗，身上沾滿番茄醬", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第四題：一直有件令你煩心的事，你覺得是什麼？",
        options: [
          { label: "經過一塊訊號不好的區域，你覺得很煩，頁面不停刷新卻沒辦法顯示內容", line: "成癮線" },
          { label: "你的朋友不斷和你提及他假期去了多少國家玩", line: "比較線" },
          { label: "下了一場大雨，你抱怨這毀了你的妝和服裝", line: "外貌線" },
          { label: "朋友還沒回你的訊息，你懷疑是不是說錯話了", line: "社交線" },
          { label: "飛天熱狗比你想像中的還難吃（被碰瓷）", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第五題：終於到達目的地了，你發現時間還很充裕，這時候你會選擇做什麼來打發時間？",
        options: [
          { label: "你不自覺打開手機 app 又關掉，不斷重複", line: "成癮線" },
          { label: "吃著剛剛點的雞塊，但你很介意為什麼這份比較小", line: "比較線" },
          { label: "你一直撥弄劉海和檢查妝容，絕對不能出差錯", line: "外貌線" },
          { label: "一次次刷新通知欄，想著新發的照片有沒有人點讚", line: "社交線" },
          { label: "追著飛天熱狗跑", line: "飛天熱狗線" }
        ]
      },
      {
        text: "第六題：活動結束後，你在回家的路上遇見了某人，你認為他是？",
        options: [
          { label: "一個逃出鐘錶店的小偷", line: "成癮線" },
          { label: "學校裡受歡迎的人生勝利組", line: "比較線" },
          { label: "正在幫路人街頭攝影的攝影師", line: "外貌線" },
          { label: "一群聊八卦的同學", line: "社交線" },
          { label: "一個穿著飛天熱狗服裝的猛漢", line: "飛天熱狗線" }
        ]
      }
    ];

    const stage = document.getElementById("stage");
    const step = document.getElementById("step");
    const bar = document.getElementById("bar");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let current = 0;
    const answers = Array(questions.length).fill(null);

    function updateMeter() {
      const pct = (Math.min(current + 1, questions.length) / questions.length) * 100;
      bar.style.width = `${pct}%`;
      step.textContent = `第 ${Math.min(current + 1, questions.length)} / ${questions.length} 題`;
    }

    function renderQuestion() {
      updateMeter();
      const q = questions[current];
      stage.innerHTML = `
        <h2 class="q">${q.text}</h2>
        <div class="options">
          ${q.options.map((opt, idx) => `
            <button class="option ${answers[current] === idx ? "active" : ""}" type="button" data-idx="${idx}">
              ${opt.label}
            </button>
          `).join("")}
        </div>
      `;

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === questions.length - 1 ? "看結果" : "下一題";
      nextBtn.disabled = answers[current] === null;

      stage.querySelectorAll(".option").forEach((el) => {
        el.addEventListener("click", () => {
          answers[current] = Number(el.dataset.idx);
          renderQuestion();
        });
      });
    }

    function buildLineCount() {
      const count = Object.fromEntries(lines.map((line) => [line, 0]));
      answers.forEach((pick, i) => {
        const line = questions[i].options[pick].line;
        count[line] += 1;
      });
      return count;
    }

    function toColorCount(lineCount) {
      return colorNames.map((color) => {
        const line = Object.keys(lineToColor).find((key) => lineToColor[key] === color);
        return lineCount[line];
      });
    }

    function isPattern(values, pattern) {
      const sorted = values.slice().sort((a, b) => b - a);
      return sorted.every((v, i) => v === pattern[i]);
    }

    function classifyResult(lineCount) {
      const colorCount = toColorCount(lineCount);
      const maxCount = Math.max(...colorCount);

      if (maxCount >= rules.extremeAtLeast) {
        const idx = colorCount.indexOf(maxCount);
        return {
          category: rules.labels.extreme,
          title: `${colorNames[idx]}極端`,
          endingLine: `${colorNames[idx]}極端`
        };
      }

      if (rules.mixedPatterns.some((pattern) => isPattern(colorCount, pattern))) {
        return {
          category: rules.labels.mixed,
          title: "均勻混合型",
          endingLine: "銀河漫遊線"
        };
      }

      if (isPattern(colorCount, rules.tiePattern)) {
        const tied = colorNames.filter((name, i) => colorCount[i] === 3);
        const tieKey = tied.slice().sort((a, b) => colorNames.indexOf(a) - colorNames.indexOf(b)).join("+");
        return {
          category: rules.labels.tie,
          title: `${tied[0]}＋${tied[1]}`,
          endingLine: rules.tieEndings[tieKey] || "未命名結局線"
        };
      }

      const maxHits = colorCount.filter((n) => n === maxCount).length;
      const isDominantPattern = rules.dominantPatterns.some((pattern) => isPattern(colorCount, pattern));
      if (maxHits === 1 && isDominantPattern) {
        const idx = colorCount.indexOf(maxCount);
        const dominantColor = colorNames[idx];
        return {
          category: rules.labels.dominant,
          title: `${dominantColor}主導`,
          endingLine: rules.dominantEndings[dominantColor] || "未命名結局線"
        };
      }

      return {
        category: rules.labels.unknown,
        title: "規則外分佈",
        endingLine: "未命名結局線"
      };
    }

    function getActiveLineKey(lineCount) {
      const activeLines = lines.filter((line) => lineCount[line] > 0);
      return activeLines.join("+");
    }

    function getMainLine(lineCount) {
      const maxCount = Math.max(...lines.map((line) => lineCount[line]));
      return lines.find((line) => lineCount[line] === maxCount) || lines[0];
    }

    function getTemplateImagePath(mainLine) {
      return `img/結果頁面/${mainLine}.png`;
    }

    function getEndingImagePath(endingLineTitle, content) {
      return content.image || `img/結果圖/${endingLineTitle}.png`;
    }

    function getEndingContent(endingLineTitle) {
      return endingContent[endingLineTitle] || defaultEndingContent;
    }

    function renderResult() {
      const lineCount = buildLineCount();
      const result = classifyResult(lineCount);
      const endingLine = {
        title: result.endingLine || "未命名結局線",
        key: getActiveLineKey(lineCount)
      };
      const mainLine = getMainLine(lineCount);
      const templateImage = getTemplateImagePath(mainLine);
      const content = getEndingContent(endingLine.title);
      const endingImage = getEndingImagePath(endingLine.title, content);
      const ending =
        rules.endings[result.title] ||
        (result.category === rules.labels.dominant ? rules.endings["主導"] :
          result.category === rules.labels.tie ? rules.endings["平手"] :
            rules.endings["規則外分佈"]);
      const colorDetail = colorNames.map((color) => {
        const line = Object.keys(lineToColor).find((key) => lineToColor[key] === color);
        return `${color} ${lineCount[line]}`;
      }).join(" ・ ");
      const lineDetail = lines.map((line) => `${line} ${lineCount[line]}`).join(" ・ ");

      step.textContent = "測驗完成";
      bar.style.width = "100%";
      prevBtn.style.display = "none";
      nextBtn.textContent = "重新測驗";
      nextBtn.disabled = false;

      stage.innerHTML = `
        <p class="pill">類型：${result.category}</p>
        <p class="pill">主線：${mainLine}</p>
        <p class="pill">結局線：${endingLine.title}</p>
        <div class="result-visual">
          <img class="result-template" src="${templateImage}" alt="${mainLine} 結果頁模板" onerror="this.hidden=true">
          ${endingImage ? `<img class="result-mascot" src="${endingImage}" alt="${endingLine.title} 結局圖片" onerror="this.hidden=true">` : ""}
        </div>
        <h2 class="result-title">${result.title}</h2>
        <ul class="result-meta">
          <li><strong>象徵：</strong>${content.symbol}</li>
          <li><strong>說明：</strong>${content.description}</li>
          <li><strong>人格標語：</strong>${content.slogans}</li>
        </ul>
        <p class="result-desc">結局組合：${endingLine.key || "無"}</p>
        <p class="result-desc">${ending}</p>
        <p class="result-desc">顏色計數：${colorDetail}</p>
        <p class="result-desc">線索計數：${lineDetail}</p>
      `;

      nextBtn.onclick = () => {
        current = 0;
        for (let i = 0; i < answers.length; i++) answers[i] = null;
        prevBtn.style.display = "inline-block";
        nextBtn.onclick = null;
        renderQuestion();
      };
    }

    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (answers[current] === null) return;
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        renderResult();
      }
    });

    renderQuestion();
  </script>
</body>

</html>
